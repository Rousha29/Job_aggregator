name: Mirror Epitech Repo

on: 
  push:
    branches:
      main

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      
uses: actions/checkout@v4
      with:
        fetch-depth: 0

      
uses: pixta-dev/repository-mirroring-action@v1
      with:
        target_repo_url:
          git@github.com:EpitechBachelorPromo2028/B-YEP-200-TLS-2-1-jobaggregator-3.git
        ssh_private_key:${{ secrets.SSH_PRIVATE_KEY }}