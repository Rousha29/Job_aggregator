name: CI — Job Aggregator

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  # Backend Node.js
  backend:
    name: Backend — Build, Lint & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: jobdb_test
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/jobdb_test
      JWT_SECRET: test_jwt_secret_for_ci
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Run tests
        run: npm test

  # Service IA Python
  ai-service:
    name: AI Service — Lint & Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./ai-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check app/ --fix

      - name: Run tests
        run: |
          pip install pytest
          pytest tests/ -v

  # Frontend React
  frontend:
    name: Frontend — Build & Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Build
        run: npm run build

  # Docker Compose
  docker:
    name: Docker Compose — Stack check
    runs-on: ubuntu-latest
    needs: [backend, frontend, ai-service, database, microservices]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env from example
        run: cp .env.example .env

      - name: Start stack
        run: docker compose up -d --build

      - name: Wait for services
        run: sleep 20

      - name: Health check backend
        run: curl -f http://localhost:4000/health || exit 1

      - name: Health check AI service
        run: curl -f http://localhost:8000/health || exit 1

      - name: Health check microservices
        run: curl -f http://localhost:5001/health || exit 1

      - name: Health check frontend
        run: curl -f http://localhost:3000/ || exit 1

      - name: Health check database
        run: pg_isready -h localhost -p 5432 -U user || exit 1

      - name: Stop stack
        run: docker compose down