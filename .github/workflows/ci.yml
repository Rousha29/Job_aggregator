name: CI — Job Aggregator

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  # Backend Node.js
  backend:
    name: Backend — Build, Lint & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: jobdb_test
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/jobdb_test
      JWT_SECRET: test_jwt_secret_for_ci
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Run tests
        run: npm test

  # Service IA Python
  ai-service:
    name: AI Service — Lint & Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./ai-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check app/ --fix

      - name: Run tests
        run: |
          pip install pytest
          pytest tests/ -v

  # Frontend React
  frontend:
    name: Frontend — Build & Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Build
        run: npm run build

  # Docker Compose
  docker:
    name: Docker Compose — Stack check
    runs-on: ubuntu-latest
    needs: [backend, frontend, ai-service]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env
        run: |
          cat > .env << EOF
          JWT_SECRET=ci_jwt_secret_12345
          POSTGRES_DB=jobdb
          POSTGRES_USER=jobuser
          POSTGRES_PASSWORD=jobpass
          DATABASE_URL=postgresql://jobuser:jobpass@database:5432/jobdb
          WELOVEDEVS_API_URL=https://epi-api.welovedevs.com/v1
          WELOVEDEVS_API_KEY=ci-test-key
          NODE_ENV=production
          AI_SERVICE_URL=http://ai-service:8000
          MICROSERVICES_URL=http://microservices:5000
          RATE_LIMIT_DELAY_MS=1000
          DEFAULT_ADMIN_EMAIL=admin@ci-test.com
          DEFAULT_ADMIN_PASSWORD=CiTestAdmin123!
          EOF

      - name: Start stack
        run: docker compose up -d --build

      - name: Wait for services
        run: sleep 45

      - name: Wait for backend health
        run: |
          set -e
          echo "Waiting for backend on http://localhost:4000/health ..."
          for i in {1..60}; do
            if curl -fsS http://localhost:4000/health > /dev/null; then
              echo "Backend is healthy."
              exit 0
            fi
            sleep 2
          done

          echo "Backend never became healthy. Dumping compose status/logs:"
          docker compose ps
          docker compose logs --no-color --tail=200
          exit 1

      - name: Health check AI service
        run: curl -f http://localhost:8000/health || exit 1

      - name: Health check microservices
        run: curl -f http://localhost:5001/health || exit 1

      - name: Health check frontend
        run: curl -f http://localhost:5173/ || exit 1

      - name: Stop stack
        run: docker compose down